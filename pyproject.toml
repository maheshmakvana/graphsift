[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphsift"
dynamic = ["version"]
description = "graphsift: Save Claude tokens, reduce LLM API costs, optimize context windows. #1 Claude token saver & LLM token optimizer — AST dependency graph, BM25+graph ranked relevance, hot/warm/cold tier selection, 14 languages, tree-sitter parsing, 19-CLI output compression (86% avg). 80-150x token reduction, F1 0.85. Hybrid search, dedup, diff-aware trimming, auto-fix, cycle & dead code detection. MCP server, Claude/OpenAI/Gemini adapters. v1.7: agent memory, typed graph retrieval, conversation compaction, evidence citations, A2A protocol, MCP async tasks, harness validation, temporal code graph, code-aware memory."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    # Primary SEO: Claude token savings (highest search volume)
    "save claude tokens",
    "claude token saver",
    "claude token optimizer",
    "claude token compression",
    "reduce claude api costs",
    "claude cost reduction",
    "claude code save tokens",
    "claude context optimizer",
    "claude api token reducer",
    "optimize claude context",
    "claude context window",
    "claude api savings",
    # Primary SEO: LLM token optimization
    "llm token optimization",
    "llm token compression",
    "llm token reducer",
    "reduce llm api costs",
    "llm context optimization",
    "llm context compression",
    "llm context window",
    "token reduction tool",
    "token cost reduction",
    "token budget tool",
    "token saving tools",
    "context window optimization",
    "code context compression",
    "code context optimization",
    # OpenAI / GPT token saving
    "save gpt tokens",
    "reduce openai api costs",
    "openai token optimizer",
    "gpt token reduction",
    "gpt context optimizer",
    # Gemini token saving
    "save gemini tokens",
    "gemini token optimizer",
    "reduce gemini api costs",
    # Code review + token savings
    "code review token savings",
    "ai code review cost reduction",
    "code review claude",
    "code review openai",
    "code review gpt4",
    "code review gpt5",
    "code review gemini",
    "code review codex",
    "code review llm",
    "code review automation",
    "code review context",
    "llm code review tool",
    # Tool-specific compression
    "cli output compression",
    "command output compression",
    "pytest output compression",
    "terminal output compression",
    "bash output compression",
    "git output compression",
    "docker output compression",
    "kubectl output compression",
    "npm output compression",
    "cargo output compression",
    "eslint output compression",
    "go test output compression",
    "jest output compression",
    "log output compression",
    "output token compression",
    # Technical: graph / AST / ranking
    "ast dependency graph",
    "code graph python",
    "dependency graph python",
    "blast radius analysis",
    "semantic code search",
    "hybrid code search",
    "codebase context llm",
    "token budget code",
    "python ast parser",
    "tree sitter parser python",
    "code intelligence python",
    "ranked context selection",
    "bm25 code search",
    "multi-file diff analysis",
    "decorator edge detection",
    "dynamic import graph",
    "monorepo context",
    "incremental code indexing",
    # Competitive / alternative
    "code-review-graph alternative",
    "better than code review graph",
    "code review graph vs graphsift",
    # Integration keywords
    "mcp server code",
    "mcp server claude",
    "claude code integration",
    "claude code mcp",
    "codex integration",
    "openai integration",
    "gemini integration",
    "openai compatible api",
    # Feature keywords
    "cycle detection python",
    "dead code detection",
    "auto fix suggestions",
    "code deduplication",
    "diff aware context",
    "cache aware llm",
    "token analytics",
    "token savings analytics",
    # Brand
    "graphsift",
    # v1.7 features
    "agent-memory",
    "graphrag",
    "typed-retrieval",
    "context-compaction",
    "a2a-protocol",
    "conversation-compaction",
    "code-memory",
    "temporal-graph",
    "evidence-citations",
    "harness-engineering",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Compilers",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Text Processing :: Filters",
    "Topic :: Utilities",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Plugins",
    "Framework :: AsyncIO",
    "Natural Language :: English",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
tokenpruner = ["tokenpruner>=1.0.0"]
treesitter = [
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-ruby>=0.23.0",
    "tree-sitter-php>=0.23.0",
    "tree-sitter-bash>=0.23.0",
]
all = [
    "tokenpruner>=1.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-ruby>=0.23.0",
    "tree-sitter-php>=0.23.0",
    "tree-sitter-bash>=0.23.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "tokenpruner>=1.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-ruby>=0.23.0",
    "tree-sitter-php>=0.23.0",
    "tree-sitter-bash>=0.23.0",
]

[project.scripts]
graphsift = "graphsift.cli:main"

[project.urls]
Homepage = "https://github.com/maheshmakvana/graphsift"
Repository = "https://github.com/maheshmakvana/graphsift"
Issues = "https://github.com/maheshmakvana/graphsift/issues"
Changelog = "https://github.com/maheshmakvana/graphsift/releases"
Documentation = "https://github.com/maheshmakvana/graphsift#readme"

[tool.setuptools.packages.find]
exclude = ["tests*", "venv*", "dist*", "build*"]

[tool.setuptools.dynamic]
version = { attr = "graphsift._version.__version__" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["graphsift"]
omit = ["tests/*", "venv/*"]
