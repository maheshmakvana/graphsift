[project.scripts]
graphsift = "graphsift.cli:main"

[project.urls]
Homepage = "https://github.com/maheshmakvana/graphsift"
Repository = "https://github.com/maheshmakvana/graphsift"
Issues = "https://github.com/maheshmakvana/graphsift/issues"
Changelog = "https://github.com/maheshmakvana/graphsift/releases"
Documentation = "https://github.com/maheshmakvana/graphsift#readme"
LinkedIn = "https://www.linkedin.com/in/mahesh-makwana/"
Download = "https://pypi.org/project/graphsift/"

[tool.setuptools.packages.find]
exclude = ["tests*", "venv*", "dist*", "build*"]

[tool.setuptools.dynamic]
version = { attr = "graphsift._version.__version__" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 120
timeout_method = "thread"
addopts = "-n auto --dist loadscope -p no:cacheprovider"

[tool.coverage.run]
source = ["graphsift"]
omit = ["tests/*", "venv/*"]

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = ["pragma: no cover", "def __repr__", "raise NotImplementedError"]
