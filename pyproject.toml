[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphsift"
dynamic = ["version"]
description = "Save Claude, GPT-5 & Gemini API costs with LLM token optimization. 80-150x code context reduction, 86% CLI compression, F1 0.85 relevance. AST dep graph, BM25+graph selection, tree-sitter parsing, MCP server, agent memory. Zero external deps."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mahesh Makvana", email = "maheshmakwana527@gmail.com" },
]
keywords = [
    "llm token optimization",
    "token cost reduction",
    "context window optimization",
    "claude token saver",
    "gemini token optimizer",
    "openai token reduction",
    "code review llm",
    "code review context",
    "ai code review cost reduction",
    "cli output compression",
    "bash output compression",
    "ast dependency graph",
    "ranked context selection",
    "bm25 code search",
    "semantic code search",
    "dead code detection",
    "blast radius analysis",
    "mcp server claude",
    "claude code integration",
    "graphsift",
    "agent-memory",
    "graphrag",
    "token analytics",
    "context-compaction",
    "conversation-compaction",
    "code-memory",
    "temporal-graph",
    "evidence-citations",
    "harness-engineering",
    "python ast parser",
    "tree-sitter parser",
    "code intelligence",
    "dynamic import graph",
    "monorepo context",
    "incremental indexing",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Compilers",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Text Processing :: Filters",
    "Topic :: Utilities",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Plugins",
    "Natural Language :: English",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
tokenpruner = ["tokenpruner>=1.0.0"]
tiktoken = ["tiktoken>=0.7.0"]
semantic = ["sentence-transformers>=2.2.0"]
sentence-transformers = ["sentence-transformers>=3.0.0", "numpy>=1.24"]
treesitter = [
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-ruby>=0.23.0",
    "tree-sitter-php>=0.23.0",
    "tree-sitter-bash>=0.23.0",
]
all = [
    "tokenpruner>=1.0.0",
    "tiktoken>=0.7.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.24",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-ruby>=0.23.0",
    "tree-sitter-php>=0.23.0",
    "tree-sitter-bash>=0.23.0",
]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.0",
    "pytest-benchmark>=5.0",
    "pytest-timeout>=2.0",
    "pytest-xdist>=3.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "tokenpruner>=1.0.0",
    "tiktoken>=0.7.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.24",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-ruby>=0.23.0",
    "tree-sitter-php>=0.23.0",
    "tree-sitter-bash>=0.23.0",
]

[project.scripts]
graphsift = "graphsift.cli:main"

[project.urls]
Homepage = "https://github.com/maheshmakvana/graphsift"
Repository = "https://github.com/maheshmakvana/graphsift"
Issues = "https://github.com/maheshmakvana/graphsift/issues"
Changelog = "https://github.com/maheshmakvana/graphsift/releases"
Documentation = "https://github.com/maheshmakvana/graphsift#readme"
LinkedIn = "https://www.linkedin.com/in/mahesh-makwana/"
Download = "https://pypi.org/project/graphsift/"

[tool.setuptools.packages.find]
exclude = ["tests*", "venv*", "dist*", "build*"]

[tool.setuptools.dynamic]
version = { attr = "graphsift._version.__version__" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 120
timeout_method = "thread"
addopts = "-n auto --dist loadscope -p no:cacheprovider"

[tool.coverage.run]
source = ["graphsift"]
omit = ["tests/*", "venv/*"]

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = ["pragma: no cover", "def __repr__", "raise NotImplementedError"]
