    "hypothesis>=6.0",
    "pytest-benchmark>=5.0",
    "pytest-timeout>=2.0",
    "pytest-xdist>=3.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "tokenpruner>=1.0.0",
    "tiktoken>=0.7.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.24",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
