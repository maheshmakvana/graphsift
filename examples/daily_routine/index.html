<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Developer Daily Routine</title>
<style>
  :root {
    --bg-primary: #0d1117;
    --bg-secondary: #161b22;
    --bg-card: #1c2333;
    --bg-card-hover: #222b3d;
    --border: #30363d;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #6e7681;
    --accent-blue: #58a6ff;
    --accent-green: #3fb950;
    --accent-yellow: #d29922;
    --accent-red: #f85149;
    --accent-purple: #bc8cff;
    --accent-cyan: #39d2c0;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-ui);
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
  }

  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
    flex-wrap: wrap;
    gap: 16px;
  }

  .header-left { display: flex; align-items: center; gap: 16px; }

  .logo {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: white;
  }

  .header h1 { font-size: 24px; font-weight: 600; }
  .header .subtitle { color: var(--text-secondary); font-size: 14px; }

  .header-actions { display: flex; gap: 8px; }

  /* Cards */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .card:hover { border-color: var(--text-muted); }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .card-title { font-size: 16px; font-weight: 600; }

  /* Stats bar */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }

  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    text-align: center;
  }

  .stat-value {
    font-size: 28px;
    font-weight: 700;
    font-family: var(--font-mono);
    line-height: 1.2;
  }

  .stat-label {
    font-size: 12px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 4px;
  }

  .stat-card.accent-blue .stat-value { color: var(--accent-blue); }
  .stat-card.accent-green .stat-value { color: var(--accent-green); }
  .stat-card.accent-yellow .stat-value { color: var(--accent-yellow); }
  .stat-card.accent-red .stat-value { color: var(--accent-red); }
  .stat-card.accent-purple .stat-value { color: var(--accent-purple); }

  /* Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
    font-family: var(--font-mono);
  }

  .badge-pending { background: rgba(139,148,158,0.15); color: var(--text-secondary); }
  .badge-running { background: rgba(88,166,255,0.15); color: var(--accent-blue); }
  .badge-done    { background: rgba(63,185,80,0.15);  color: var(--accent-green); }
  .badge-failed  { background: rgba(248,81,73,0.15);  color: var(--accent-red); }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-secondary);
    color: var(--text-primary);
    font-size: 13px;
    font-family: var(--font-ui);
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    white-space: nowrap;
  }

  .btn:hover { background: var(--bg-card-hover); border-color: var(--text-muted); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-primary {
    background: var(--accent-blue);
    color: #fff;
    border-color: var(--accent-blue);
  }

  .btn-primary:hover { background: #4a9af5; border-color: #4a9af5; }

  .btn-success {
    background: var(--accent-green);
    color: #fff;
    border-color: var(--accent-green);
  }

  .btn-success:hover { background: #36a84a; border-color: #36a84a; }

  .btn-danger {
    background: transparent;
    color: var(--accent-red);
    border-color: var(--accent-red);
  }

  .btn-danger:hover { background: rgba(248,81,73,0.1); }

  .btn-sm { padding: 4px 10px; font-size: 12px; }

  /* Task list */
  .task-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 16px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 8px;
    transition: background 0.2s;
    flex-wrap: wrap;
  }

  .task-item:hover { background: var(--bg-card); }

  .task-info { flex: 1; min-width: 200px; }

  .task-name {
    font-weight: 500;
    font-size: 14px;
  }

  .task-meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .task-actions { display: flex; gap: 6px; }

  .task-result {
    width: 100%;
    margin-top: 8px;
    padding: 10px 14px;
    background: rgba(0,0,0,0.3);
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-secondary);
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 120px;
    overflow-y: auto;
  }

  /* Report section */
  .report-section { display: none; }

  .report-section.visible { display: block; }

  .metrics-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 8px;
  }

  .metrics-table th {
    text-align: left;
    padding: 8px 12px;
    color: var(--text-secondary);
    font-weight: 500;
    border-bottom: 1px solid var(--border);
  }

  .metrics-table td {
    padding: 6px 12px;
    font-family: var(--font-mono);
    font-size: 12px;
    border-bottom: 1px solid var(--border);
  }

  /* Progress bar */
  .progress-bar {
    width: 100%;
    height: 4px;
    background: var(--bg-secondary);
    border-radius: 2px;
    overflow: hidden;
    margin: 16px 0;
    display: none;
  }

  .progress-bar.visible { display: block; }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
    border-radius: 2px;
    transition: width 0.3s ease;
    width: 0%;
  }

  /* Spinner */
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--text-muted);
    border-top-color: var(--accent-blue);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  .toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 1000;
  }

  .toast {
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    background: var(--bg-card);
    border: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    animation: slideIn 0.3s ease;
    max-width: 400px;
  }

  .toast.success { border-color: var(--accent-green); }
  .toast.error { border-color: var(--accent-red); }
  .toast.info { border-color: var(--accent-blue); }

  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* Tabs */
  .tabs { display: flex; gap: 0; margin-bottom: 24px; border-bottom: 1px solid var(--border); }

  .tab {
    padding: 10px 20px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-secondary);
    border-bottom: 2px solid transparent;
    transition: color 0.2s, border-color 0.2s;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    font-family: var(--font-ui);
  }

  .tab:hover { color: var(--text-primary); }
  .tab.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); }

  /* Responsive */
  @media (max-width: 640px) {
    .container { padding: 12px; }
    .header { flex-direction: column; align-items: stretch; }
    .header-actions { justify-content: stretch; }
    .header-actions .btn { flex: 1; justify-content: center; }
    .task-item { flex-direction: column; align-items: stretch; }
    .task-actions { justify-content: flex-end; }
  }
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo">DR</div>
      <div>
        <h1>Developer Daily Routine</h1>
        <div class="subtitle">graphsift-powered workflow simulator</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" onclick="runAllTasks()" id="runAllBtn">
        <span>&#9654;</span> Run All Daily Tasks
      </button>
      <button class="btn btn-success" onclick="seedTasks()" id="seedBtn">
        Seed Tasks
      </button>
      <button class="btn btn-danger" onclick="resetAll()" id="resetBtn">
        Reset
      </button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card accent-blue">
      <div class="stat-value" id="statTotal">0</div>
      <div class="stat-label">Total Tasks</div>
    </div>
    <div class="stat-card accent-green">
      <div class="stat-value" id="statDone">0</div>
      <div class="stat-label">Completed</div>
    </div>
    <div class="stat-card accent-red">
      <div class="stat-value" id="statFailed">0</div>
      <div class="stat-label">Failed</div>
    </div>
    <div class="stat-card accent-purple">
      <div class="stat-value" id="statTokens">0</div>
      <div class="stat-label">Tokens Used</div>
    </div>
    <div class="stat-card accent-yellow">
      <div class="stat-value" id="statCompletion">0%</div>
      <div class="stat-label">Completion Rate</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('tasks', this)">Tasks</button>
    <button class="tab" onclick="switchTab('report', this)">Daily Report</button>
  </div>

  <!-- Progress -->
  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <!-- Tasks Tab -->
  <div id="tasksTab">
    <div id="taskList"></div>
  </div>

  <!-- Report Tab -->
  <div id="reportTab" class="report-section">
    <div class="card">
      <div class="card-header">
        <div class="card-title">Daily Summary Report</div>
        <button class="btn btn-sm" onclick="refreshReport()">Refresh</button>
      </div>
      <table class="metrics-table" id="reportTable">
        <thead>
          <tr>
            <th>Metric</th>
            <th>Value</th>
          </tr>
        </thead>
        <tbody id="reportBody"></tbody>
      </table>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">graphsift Adapter Metrics</div>
      </div>
      <table class="metrics-table">
        <thead>
          <tr>
            <th>Operation</th>
            <th>Duration</th>
            <th>In Tokens</th>
            <th>Out Tokens</th>
            <th>Saved</th>
          </tr>
        </thead>
        <tbody id="graphsiftMetricsBody"></tbody>
      </table>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">Token Savings Summary</div>
      </div>
      <div id="savingsSummary" style="font-size: 13px; color: var(--text-secondary);"></div>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
// ── API base ──────────────────────────────────────────────────────────
const API = '';
// ── State ─────────────────────────────────────────────────────────────
let currentTab = 'tasks';

// ── Toast notifications ───────────────────────────────────────────────
function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => { toast.remove(); }, 4000);
}

// ── API helpers ───────────────────────────────────────────────────────
async function api(path, options = {}) {
  const resp = await fetch(`${API}${path}`, {
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    ...options,
  });
  if (!resp.ok && resp.status !== 204) {
    const err = await resp.text();
    throw new Error(`HTTP ${resp.status}: ${err}`);
  }
  if (resp.status === 204) return null;
  return resp.json();
}

// ── Tab switching ─────────────────────────────────────────────────────
function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tasksTab').style.display = tab === 'tasks' ? 'block' : 'none';
  document.getElementById('reportTab').classList.toggle('visible', tab === 'report');
  if (tab === 'report') refreshReport();
}

// ── Render helpers ────────────────────────────────────────────────────
function statusBadge(status) {
  const labels = { pending: 'Pending', running: 'Running', done: 'Done', failed: 'Failed' };
  return `<span class="badge badge-${status}">${labels[status] || status}</span>`;
}

function taskTypeLabel(type) {
  const map = {
    code_review: 'Code Review',
    pr_checks: 'PR Checks',
    dependency_scan: 'Dependency Scan',
    changelog: 'Changelog',
    issue_triage: 'Issue Triage',
    custom: 'Custom',
  };
  return map[type] || type;
}

// ── Task list ─────────────────────────────────────────────────────────
async function loadTasks() {
  try {
    const tasks = await api('/api/tasks');
    renderTasks(tasks);
    updateStats(tasks);
  } catch (err) {
    console.error('Failed to load tasks:', err);
    document.getElementById('taskList').innerHTML =
      `<div class="card"><p style="color:var(--accent-red);">Failed to load tasks: ${err.message}</p>
      <p style="color:var(--text-secondary);font-size:13px;margin-top:8px;">
        Make sure the FastAPI server is running on port 8000.</p></div>`;
  }
}

function renderTasks(tasks) {
  const container = document.getElementById('taskList');
  if (!tasks || tasks.length === 0) {
    container.innerHTML = `<div class="card"><p style="color:var(--text-secondary);text-align:center;padding:20px;">
      No tasks yet. Click <strong>"Seed Tasks"</strong> to create the default daily routine.</p></div>`;
    return;
  }

  container.innerHTML = tasks.map(t => {
    const isRunning = t.status === 'running';
    return `
      <div class="task-item" id="task-${t.id}">
        <div class="task-info">
          <div class="task-name">
            ${isRunning ? '<span class="spinner"></span>' : ''}
            ${t.name}
          </div>
          <div class="task-meta">
            ${statusBadge(t.status)}
            ${taskTypeLabel(t.task_type)}
            ${t.tokens_used > 0 ? `&middot; ${t.tokens_used} tokens` : ''}
            ${t.duration_ms > 0 ? `&middot; ${t.duration_ms.toFixed(1)}ms` : ''}
            ${t.completed_at ? `&middot; ${new Date(t.completed_at).toLocaleTimeString()}` : ''}
          </div>
          ${t.result ? `<div class="task-result">${escapeHtml(t.result)}</div>` : ''}
        </div>
        <div class="task-actions">
          <button class="btn btn-sm btn-primary" onclick="runTask('${t.id}')"
            ${t.status === 'running' || t.status === 'done' ? 'disabled' : ''}>
            ${t.status === 'done' ? 'Re-run' : 'Run'}
          </button>
        </div>
      </div>`;
  }).join('');
}

function updateStats(tasks) {
  if (!tasks) tasks = [];
  const total = tasks.length;
  const done = tasks.filter(t => t.status === 'done').length;
  const failed = tasks.filter(t => t.status === 'failed').length;
  const tokens = tasks.reduce((s, t) => s + (t.tokens_used || 0), 0);
  const completion = total ? Math.round(done / total * 100) : 0;

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statFailed').textContent = failed;
  document.getElementById('statTokens').textContent = tokens.toLocaleString();
  document.getElementById('statCompletion').textContent = `${completion}%`;
}

// ── Task operations ───────────────────────────────────────────────────
async function seedTasks() {
  try {
    await api('/api/tasks', {
      method: 'POST',
      body: JSON.stringify({ name: '__seed_defaults__', description: '', task_type: 'custom' }),
    });
    showToast('Default tasks seeded successfully', 'success');
    await loadTasks();
  } catch (err) {
    showToast(`Failed to seed tasks: ${err.message}`, 'error');
  }
}

async function runTask(taskId) {
  try {
    const result = await api(`/api/tasks/${taskId}/run`, { method: 'POST' });
    showToast(`Task "${result.name}" completed`, 'success');
    await loadTasks();
  } catch (err) {
    showToast(`Task failed: ${err.message}`, 'error');
    await loadTasks();
  }
}

async function runAllTasks() {
  const btn = document.getElementById('runAllBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Running...';

  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  progressBar.classList.add('visible');

  try {
    // Get tasks first
    const tasks = await api('/api/tasks');
    const pending = tasks.filter(t => t.status === 'pending');
    if (pending.length === 0) {
      showToast('No pending tasks to run', 'info');
      btn.disabled = false;
      btn.innerHTML = '<span>&#9654;</span> Run All Daily Tasks';
      progressBar.classList.remove('visible');
      return;
    }

    // Run each task sequentially with progress
    for (let i = 0; i < pending.length; i++) {
      const pct = Math.round(((i) / pending.length) * 100);
      progressFill.style.width = `${pct}%`;
      await runTask(pending[i].id);
    }

    progressFill.style.width = '100%';
    showToast(`All ${pending.length} tasks completed`, 'success');

    // Refresh report if on report tab
    if (currentTab === 'report') refreshReport();
  } catch (err) {
    showToast(`Error: ${err.message}`, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span>&#9654;</span> Run All Daily Tasks';
    setTimeout(() => progressBar.classList.remove('visible'), 1500);
  }
}

async function resetAll() {
  if (!confirm('Reset all tasks and metrics?')) return;
  try {
    await api('/api/reset', { method: 'POST' });
    showToast('All tasks reset', 'info');
    await loadTasks();
    document.getElementById('reportBody').innerHTML = '';
    document.getElementById('graphsiftMetricsBody').innerHTML = '';
    document.getElementById('savingsSummary').textContent = '';
  } catch (err) {
    showToast(`Reset failed: ${err.message}`, 'error');
  }
}

// ── Report ────────────────────────────────────────────────────────────
async function refreshReport() {
  try {
    const report = await api('/api/report');
    renderSummary(report);
    renderGraphsiftMetrics(report.graphsift_metrics);
    renderSavings(report.graphsift_metrics);
  } catch (err) {
    showToast(`Failed to load report: ${err.message}`, 'error');
  }
}

function renderSummary(report) {
  const body = document.getElementById('reportBody');
  const rows = [
    ['Total Tasks', report.total_tasks],
    ['Completed', report.completed],
    ['Failed', report.failed],
    ['Pending', report.pending],
    ['Completion Rate', `${report.completion_rate}%`],
    ['Total Tokens Used', report.total_tokens.toLocaleString()],
    ['Total Duration', `${report.total_duration_ms.toFixed(1)}ms`],
    ['Avg Duration / Task', `${report.avg_duration_ms.toFixed(1)}ms`],
  ];

  // Add graphsift-level metrics
  const g = report.graphsift_metrics || {};
  rows.push(
    ['graphsift Calls', g.total_calls || 0],
    ['graphsift Duration', `${g.total_duration_ms || 0}ms`],
    ['graphsift Tokens Processed', g.total_tokens_processed || 0],
    ['graphsift Tokens Saved', g.total_tokens_saved || 0],
  );

  body.innerHTML = rows.map(([k, v]) =>
    `<tr><td style="color:var(--text-secondary)">${k}</td><td><strong>${v}</strong></td></tr>`
  ).join('');
}

function renderGraphsiftMetrics(metrics) {
  const body = document.getElementById('graphsiftMetricsBody');
  if (!metrics || !metrics.calls || metrics.calls.length === 0) {
    body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:16px;">No graphsift calls recorded yet. Run some tasks first.</td></tr>';
    return;
  }

  body.innerHTML = metrics.calls.map(c => `
    <tr>
      <td>${c.operation}</td>
      <td>${c.duration_ms.toFixed(1)}ms</td>
      <td>${c.input_tokens.toLocaleString()}</td>
      <td>${c.output_tokens.toLocaleString()}</td>
      <td style="color:${c.tokens_saved > 0 ? 'var(--accent-green)' : 'inherit'}">
        ${c.tokens_saved > 0 ? c.tokens_saved.toLocaleString() : '-'}
      </td>
    </tr>
  `).join('');

  // Total row
  const total = metrics.calls.reduce((s, c) => ({
    dur: s.dur + c.duration_ms,
    in: s.in + c.input_tokens,
    out: s.out + c.output_tokens,
    saved: s.saved + c.tokens_saved,
  }), { dur: 0, in: 0, out: 0, saved: 0 });

  body.innerHTML += `
    <tr style="border-top:2px solid var(--border);font-weight:600;">
      <td>TOTAL</td>
      <td>${total.dur.toFixed(1)}ms</td>
      <td>${total.in.toLocaleString()}</td>
      <td>${total.out.toLocaleString()}</td>
      <td style="color:var(--accent-green)">${total.saved.toLocaleString()}</td>
    </tr>`;
}

function renderSavings(metrics) {
  const el = document.getElementById('savingsSummary');
  if (!metrics || !metrics.total_tokens_processed || !metrics.total_tokens_saved) {
    el.textContent = 'No token savings data available yet. Run tasks to generate metrics.';
    return;
  }

  const processed = metrics.total_tokens_processed || 0;
  const saved = metrics.total_tokens_saved || 0;
  const ratio = processed > 0 ? Math.round(saved / processed * 100) : 0;

  el.innerHTML = `
    <p>graphsift processed <strong>${processed.toLocaleString()}</strong> tokens across
    <strong>${metrics.total_calls || 0}</strong> operations,
    saving <strong style="color:var(--accent-green)">${saved.toLocaleString()}</strong> tokens
    (<strong>${ratio}%</strong> compression ratio).</p>
    <p style="margin-top:8px;">
      <span style="color:var(--accent-cyan);font-family:var(--font-mono);font-size:12px;">
        ${metrics.total_calls > 0 ? (metrics.total_duration_ms / metrics.total_calls).toFixed(1) : 0}ms avg per operation
      </span>
    </p>`;
}

// ── Utility ───────────────────────────────────────────────────────────
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ── Poll for running tasks ────────────────────────────────────────────
let pollInterval = null;

function startPolling() {
  pollInterval = setInterval(loadTasks, 2000);
}

function stopPolling() {
  if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
}

// ── Init ──────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  loadTasks();
  startPolling();
});
</script>
</body>
</html>
