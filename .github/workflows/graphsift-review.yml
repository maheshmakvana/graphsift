name: graphsift Code Review Context

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  blast-radius:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install graphsift
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Build dependency graph with risk scoring
        run: graphsift build
        timeout-minutes: 10
        env:
          GRAPHSIFT_PROGRESS_INTERVAL: 0

      - name: Generate blast radius PR comment
        id: graphsift-analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python .github/scripts/graphsift_pr_comment.py

      - name: Post PR comment
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const commentPath = process.env.RUNNER_TEMP + '/graphsift_comment.md';
            if (fs.existsSync(commentPath)) {
              const comment = fs.readFileSync(commentPath, 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
              console.log('graphsift blast radius comment posted.');
            } else {
              console.log('No comment file found — analysis may have been skipped.');
            }
